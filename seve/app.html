<script>
  /* Écran de chargement : il disparaît dès que la première vue est rendue.
     Et si rien ne s’affiche — fichier manquant sur le serveur, script bloqué —
     il le dit et indique où regarder, plutôt que de laisser une page vide. */
  (function () {
    var boot = document.getElementById('boot');
    var app = document.getElementById('app');
    function rendue() { return !!(app && app.children.length); }
    function cacher() {
      if (!boot) { return; }
      boot.classList.add('is-hidden');
      setTimeout(function () { if (boot.parentNode) { boot.remove(); } }, 320);
    }
    function expliquer() {
      if (!boot) { return; }
      var titre = boot.querySelector('.name');
      var aide = boot.querySelector('.hint');
      var barre = boot.querySelector('.bar');
      if (barre) { barre.remove(); }
      if (titre) { titre.textContent = 'Le site n’a pas pu démarrer'; }
      if (aide) {
        aide.innerHTML = 'Un fichier de l’application manque probablement sur le serveur.' +
          '<br><span style="font-size:14px;line-height:1.5;display:inline-block;margin-top:6px">' +
          'Ouvrez <a href="verification" style="color:inherit;text-decoration:underline">la page de vérification</a> : ' +
          'elle indique lequel. Aucune donnée n’est perdue.</span>';
      }
    }
    function surveiller(n) {
      if (rendue()) { cacher(); return; }
      if (n >= 16) { expliquer(); return; }
      setTimeout(function () { surveiller(n + 1); }, 250);
    }
    window.addEventListener('load', function () {
      setTimeout(function () { if (rendue()) { cacher(); } else { surveiller(0); } }, 120);
    });
  })();
</script>
